# Core

set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse off
bind m set -g mouse \; display "Mouse: #{?mouse,ON,OFF}"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g escape-time 0
set -g repeat-time 1000
set -g focus-events on


# Window
bind -r [ previous-window
bind -r ] next-window


# Pane resizing
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3


# Splitting
bind _ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


# Copying
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel


# Session
bind C command-prompt -p "New session name:" "new-session -s '%%'"


# Reload config
bind r source-file ~/.config/tmux/tmux.conf


# Status bar
set -g status 2
set -g status-format[0] ""
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
set -g status-interval 13
set -g status-left-length 60
set -g status-right-length 90
set -g status-position bottom


# Theme
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ",xterm-256color:Tc"


# Status bar
set -g status-style "bg=default,fg=#cdd6f4"

# Left - session → hostname → prefix indicator
# set -g status-left "#[fg=#f38ba8,bg=default]#[fg=#1e1e2e,bg=#f38ba8,bold] #S #[fg=#f38ba8,bg=#fab387]#[fg=#1e1e2e,bg=#fab387] #h #[fg=#fab387,bg=#f9e2af]#[fg=#1e1e2e,bg=#f9e2af,bold] #{?client_prefix, ^A ,} #[fg=#f9e2af,bg=default] "
set -g status-left "   "

# Window 
setw -g window-status-current-format "#[fg=#89b4fa,bg=#181825]#[fg=#1e1e2e,bg=#89b4fa,bold] #I #[fg=#313244,bg=#89b4fa,bold]|#[fg=#1e1e2e,bg=#89b4fa,bold] #W #[fg=#89b4fa,bg=default]"
setw -g window-status-format "#[fg=#313244,bg=#181825]#[fg=#a6adc8,bg=#313244] #I | #W #[fg=#313244,bg=default]"

setw -g window-status-separator "  "
set -g window-active-style "bg=#313244"
set -g status-justify left

# Right - mouse → uptime → cpu
#set -g status-right "#[fg=#181825,bg=#a6e3a1]#[fg=#1e1e2e,bg=#a6e3a1] 󰍽 #{?mouse,ON,OFF} #[fg=#a6e3a1,bg=#89b4fa]#[fg=#1e1e2e,bg=#89b4fa]  #(uptime -p | sed -E 's/up //; s/ hours?/h/g; s/ minutes?/m/g; s/ days?/d/g; s|, | |g') #[fg=#89b4fa,bg=#b4befe]   "

# Right - prefix -> mouse -> session
set -g status-right "#[fg=#313244,bg=#181825]#[fg=#a8adc8,bg=#313244, bold]#{?client_prefix, ^A ,} 󰍽 #{?mouse,ON,OFF} #[fg=#181834,bg=#89b4fa,bold] #S#[fg=#89b4fa,bg=default]#[bg=default]  "


# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'

## SessionX
set -g @session-bind 'o'

## Resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-stratergy-nvim 'session'

## Continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

## TPM
run '~/.tmux/plugins/tpm/tpm'
